name: Publish TestPyPI

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: Build all packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Build distributions (dev version)
        run: |
          TIMESTAMP=$(date -u +%Y%m%d%H%M%S)
          mkdir -p dist_all
          for PKG in packages/*/; do
            PKG_NAME=$(basename "$PKG")
            echo "Building $PKG_NAME..."

            # Determine base version from latest matching tag
            LATEST_TAG=$(git tag --list "${PKG_NAME}-v*" --sort=-v:refname | head -1)
            if [ -n "$LATEST_TAG" ]; then
              BASE_VERSION=$(echo "$LATEST_TAG" | sed 's/.*-v//')
            else
              BASE_VERSION="0.0.0"
            fi

            DEV_VERSION="${BASE_VERSION}.dev${TIMESTAMP}"
            echo "  Version: $DEV_VERSION (base: $BASE_VERSION, from tag: ${LATEST_TAG:-none})"

            # Build straight into the shared dist_all dir. An absolute --out-dir keeps the
            # location unambiguous regardless of how uv resolves --directory/--out-dir.
            SETUPTOOLS_SCM_PRETEND_VERSION="$DEV_VERSION" uv build --directory "$PKG" --out-dir "$PWD/dist_all"
          done
          uvx twine check dist_all/*

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist_all/

  smoke-test:
    name: Smoke test all packages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Verify clean wheel installs
        env:
          VIRTUAL_ENV: .venv-smoke
        run: |
          uv venv .venv-smoke
          uv pip install dist/*.whl
          PKGS=$(jq -r '[.packages[] | .["package-name"]] | join(" ")' .github/release-please-config.json)
          uv run python scripts/smoke.py $PKGS

  publish:
    name: Publish to TestPyPI
    needs: smoke-test
    runs-on: ubuntu-latest
    permissions:
      id-token: write # needed to authenticate with TestPyPI via OIDC
    environment:
      name: testpypi
      url: https://test.pypi.org/
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
