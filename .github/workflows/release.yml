name: Release Please

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create releases and tags
      pull-requests: write # to create release PRs
    outputs:
      packages: ${{ steps.packages.outputs.matrix }}
      rp_outputs: ${{ toJSON(steps.release-please.outputs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: packages
        run: |
          echo "matrix=$(jq -c '[.packages | to_entries[] | {name: .value["package-name"], path: .key}]' .github/release-please-config.json)" >> "$GITHUB_OUTPUT"

      - id: release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
          target-branch: main
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build ${{ matrix.package.name }}
    needs: release-please
    strategy:
      matrix:
        package: ${{ fromJSON(needs.release-please.outputs.packages) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_CREATED: ${{ fromJSON(needs.release-please.outputs.rp_outputs)[format('{0}--release_created', matrix.package.path)] }}
    steps:
      - name: Skip when no release was created for this package
        if: ${{ env.RELEASE_CREATED != 'true' }}
        run: echo "No release created for ${{ matrix.package.name }}, skipping."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ env.RELEASE_CREATED == 'true' }}
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.rp_outputs)[format('{0}--tag_name', matrix.package.path)] }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: ${{ env.RELEASE_CREATED == 'true' }}
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        if: ${{ env.RELEASE_CREATED == 'true' }}
        with:
          enable-cache: false

      - name: Build
        if: ${{ env.RELEASE_CREATED == 'true' }}
        working-directory: ${{ matrix.package.path }}
        run: |
          mkdir -p dist
          uv build --out-dir dist && uvx twine check dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ env.RELEASE_CREATED == 'true' }}
        with:
          name: ${{ matrix.package.name }}-dist
          path: ${{ matrix.package.path }}/dist/

  smoke:
    name: Smoke test ${{ matrix.package.name }}
    needs: [release-please, build]
    strategy:
      matrix:
        package: ${{ fromJSON(needs.release-please.outputs.packages) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # to download artifacts
    env:
      RELEASE_CREATED: ${{ fromJSON(needs.release-please.outputs.rp_outputs)[format('{0}--release_created', matrix.package.path)] }}
    steps:
      - name: Skip when no release was created for this package
        if: ${{ env.RELEASE_CREATED != 'true' }}
        run: echo "No release created for ${{ matrix.package.name }}, skipping."

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: ${{ env.RELEASE_CREATED == 'true' }}
        with:
          python-version: "3.13"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ env.RELEASE_CREATED == 'true' }}
        with:
          sparse-checkout: scripts/
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ env.RELEASE_CREATED == 'true' }}
        with:
          name: ${{ matrix.package.name }}-dist
          path: dist/

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        if: ${{ env.RELEASE_CREATED == 'true' }}
        with:
          enable-cache: false

      - name: Verify clean wheel install
        if: ${{ env.RELEASE_CREATED == 'true' }}
        env:
          VIRTUAL_ENV: .venv-smoke
          PKG_NAME: ${{ matrix.package.name }}
        run: |
          uv venv .venv-smoke
          uv pip install dist/*.whl
          uv run --active python scripts/smoke.py "$PKG_NAME"

  publish:
    name: Publish ${{ matrix.package.name }} to PyPI
    needs: [release-please, smoke]
    strategy:
      matrix:
        package: ${{ fromJSON(needs.release-please.outputs.packages) }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # needed to authenticate with PyPI via OIDC
    environment:
      name: pypi
      url: https://pypi.org/p/${{ matrix.package.name }}
    env:
      RELEASE_CREATED: ${{ fromJSON(needs.release-please.outputs.rp_outputs)[format('{0}--release_created', matrix.package.path)] }}
    steps:
      - name: Skip when no release was created for this package
        if: ${{ env.RELEASE_CREATED != 'true' }}
        run: echo "No release created for ${{ matrix.package.name }}, skipping."

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ env.RELEASE_CREATED == 'true' }}
        with:
          name: ${{ matrix.package.name }}-dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        if: ${{ env.RELEASE_CREATED == 'true' }}
