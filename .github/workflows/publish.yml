name: Publish

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Release Please tag to publish
        required: true
        type: string
      source_ref:
        description: Ref containing the release-build fix.
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  identify:
    name: Identify package
    runs-on: ubuntu-latest
    permissions:
      contents: read # to checkout the repo and read release-please config
    outputs:
      package: ${{ steps.parse.outputs.package }}
      path: ${{ steps.parse.outputs.path }}
      pypi_name: ${{ steps.parse.outputs.pypi_name }}
      import_name: ${{ steps.parse.outputs.import_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Parse tag
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        id: parse
        run: |
          PKG_NAME=$(echo "$TAG" | sed 's/-v[0-9].*//')
          RESULT=$(jq -r --arg pkg "$PKG_NAME" '
            .packages | to_entries[] |
            select(.value["package-name"] == $pkg) |
            "package=\(.value["package-name"])\npath=\(.key)\npypi_name=\(.value["package-name"])"
          ' .github/release-please-config.json)
          if [ -z "$RESULT" ]; then
            echo "::error::Unknown package from tag: $TAG"
            exit 1
          fi
          echo -e "$RESULT" >> $GITHUB_OUTPUT
          echo "import_name=$(echo "$PKG_NAME" | tr '-' '_')" >> $GITHUB_OUTPUT

  build:
    name: Build
    needs: identify
    if: needs.identify.outputs.package != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read # to checkout the repo and build
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Apply recovery tag
        if: ${{ inputs.source_ref != '' }}
        env:
          TAG: ${{ inputs.tag }}
        run: git tag -f "$TAG"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Build distributions
        working-directory: ${{ needs.identify.outputs.path }}
        run: |
          mkdir -p dist
          uv build --out-dir dist && uvx twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: ${{ needs.identify.outputs.path }}/dist/

  smoke-test:
    name: Smoke test
    needs:
      - identify
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: read # to download artifacts
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Verify clean wheel install
        env:
          VIRTUAL_ENV: .venv-smoke
          IMPORT_NAME: ${{ needs.identify.outputs.import_name }}
          PYPI_NAME: ${{ needs.identify.outputs.pypi_name }}
        run: |
          uv venv .venv-smoke
          uv pip install dist/*.whl
          uv run python -c "
          import importlib.metadata as metadata
          import importlib, os
          importlib.import_module(os.environ['IMPORT_NAME'])
          print(metadata.version(os.environ['PYPI_NAME']))
          "

  publish:
    name: Publish to PyPI
    needs:
      - identify
      - smoke-test
    runs-on: ubuntu-latest
    permissions:
      id-token: write # needed to authenticate with PyPI via OIDC
    environment:
      name: pypi
      url: https://pypi.org/p/${{ needs.identify.outputs.pypi_name }}
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
