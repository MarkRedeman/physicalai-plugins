[build-system]
requires = ["hatchling<1.30", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "physicalai-openarm-plugin"
dynamic = ["version"]
description = "Native SocketCAN/Damiao OpenArm robot plugin for PhysicalAI"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "physicalai>=0.1.1",
    "physicalai-studio-plugin",
    "numpy>=1.24",
    "loguru>=0.7",
    "pydantic>=2.0",
    "python-can>=4.2,<5",
]

[project.optional-dependencies]
tests = ["pytest"]

[project.urls]
Homepage = "https://github.com/MarkRedeman/physicalai-plugins"
Repository = "https://github.com/MarkRedeman/physicalai-plugins"
Issues = "https://github.com/MarkRedeman/physicalai-plugins/issues"

[project.entry-points."physicalai.studio.catalog_plugins"]
openarm = "physicalai_openarm_plugin.studio_catalog:register_physicalai_studio_plugin"

[tool.hatch.version]
source = "vcs"
tag-pattern = '^physicalai-openarm-plugin-v(?P<version>\d+(?:\.\d+)*)$'
raw-options = { search_parent_directories = true, git_describe_command = "git describe --dirty --tags --long --match physicalai-openarm-plugin-v*" }

[tool.hatch.build.targets.wheel]
packages = ["src/physicalai_openarm_plugin"]

[tool.hatch.build.targets.wheel.force-include]
"urdf" = "urdf"

[tool.hatch.build.targets.sdist]
include = ["src/physicalai_openarm_plugin/**", "urdf/**", "README.md", "pyproject.toml"]
exclude = ["examples/**"]

[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"
