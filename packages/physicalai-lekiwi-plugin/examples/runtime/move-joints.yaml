# LeKiwi sinusoidal motion runtime config (move_joints).
#
# Drives the 6 arm joints through a sine wave while oscillating the base
# rotation, as an actuation smoke test. Run from the repo root with:
#
#   uv run physicalai run --config packages/physicalai-lekiwi-plugin/examples/runtime/move-joints.yaml
#
# `calibration` must point at a LeKiwiCalibration JSON — LeKiwi requires it
# (raw-ticks bringup is not config-expressible).

runtime:
  robot:
    class_path: physicalai_lekiwi_plugin.LeKiwi
    init_args:
      port: /dev/ttyACM0 # CHANGE_ME: LeKiwi serial port
      baudrate: 1000000
      calibration: ./calibration.json # CHANGE_ME: path to LeKiwiCalibration JSON

  action_source:
    class_path: physicalai_lekiwi_plugin.motion.SineWaveSource
    init_args:
      frequency: 0.25 # Hz
      joint_amplitudes: [10, 10, 10, 10, 10, 10, 0, 0, 15] # arm deg, base vtheta deg/s
      phase_offsets: [0, 1.0472, 2.0944, 3.1416, 4.1888, 5.236, 0, 0, 0] # arm i*2pi/6

  fps: 20

run:
  duration_s: 10
