[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "physicalai-lekiwi-plugin"
dynamic = ["version"]
description = "LeKiwi mobile manipulator plugin for PhysicalAI (6-DOF arm + 3-wheel holonomic base)"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "physicalai>=0.1.1",
    "physicalai-studio-plugin",
    "numpy>=1.24",
    "loguru>=0.7",
    "pydantic>=2.0",
    "feetech-servo-sdk>=1.0",
    "pyserial>=3.5",
]

[project.optional-dependencies]
tests = ["pytest"]

[project.urls]
Homepage = "https://github.com/MarkRedeman/physicalai-plugins"
Repository = "https://github.com/MarkRedeman/physicalai-plugins"
Issues = "https://github.com/MarkRedeman/physicalai-plugins/issues"

[project.entry-points."physicalai.studio.catalog_plugins"]
lekiwi = "physicalai_lekiwi_plugin.studio_catalog:register_physicalai_studio_plugin"

[tool.hatch.version]
source = "vcs"
tag-pattern = '^(?:packages/[\w-]+-)?[vV]?(?P<version>\d+(?:\.\d+)*)$'
raw-options = { search_parent_directories = true }

[tool.hatch.build.targets.wheel]
packages = ["src/physicalai_lekiwi_plugin"]

[tool.hatch.build.targets.wheel.force-include]
"urdf" = "urdf"

[tool.hatch.build.targets.sdist]
include = [
    "src/physicalai_lekiwi_plugin/**",
    "urdf/**",
    "README.md",
    "pyproject.toml",
    "LICENSE",
]
exclude = [
    "examples/**",
]
