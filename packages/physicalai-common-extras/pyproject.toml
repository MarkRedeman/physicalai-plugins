[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "physicalai-common-extras"
dynamic = ["version"]
description = "Reusable action sources and runtime callbacks for PhysicalAI plugins"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "physicalai>=0.1.1",
    "numpy>=1.24",
]

[project.optional-dependencies]
tests = ["pytest"]

[project.urls]
Homepage = "https://github.com/MarkRedeman/physicalai-plugins"
Repository = "https://github.com/MarkRedeman/physicalai-plugins"
Issues = "https://github.com/MarkRedeman/physicalai-plugins/issues"

[tool.hatch.version]
source = "vcs"
tag-pattern = '^(?:packages/[\w-]+-)?[vV]?(?P<version>\d+(?:\.\d+)*)$'
raw-options = { search_parent_directories = true }

[tool.hatch.build.targets.wheel]
packages = ["src/physicalai_common_extras"]

[tool.hatch.build.targets.sdist]
include = [
    "src/physicalai_common_extras/**",
    "README.md",
    "pyproject.toml",
    "LICENSE",
]
exclude = [
    "examples/**",
]

[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"