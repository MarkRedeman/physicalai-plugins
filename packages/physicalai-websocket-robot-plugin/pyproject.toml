[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "physicalai-websocket-robot-plugin"
dynamic = ["version"]
description = "WebSocket-based remote robot client implementing the PhysicalAI Robot protocol"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "physicalai>=0.1.1",
    "physicalai-studio-plugin",
    "numpy>=1.24",
    "loguru>=0.7",
    "websockets>=12",
]

[project.optional-dependencies]
tests = ["pytest"]

[project.urls]
Homepage = "https://github.com/MarkRedeman/physicalai-rebot-b601-plugin"
Repository = "https://github.com/MarkRedeman/physicalai-rebot-b601-plugin"
Issues = "https://github.com/MarkRedeman/physicalai-rebot-b601-plugin/issues"

[project.entry-points."physicalai.studio.catalog_plugins"]
websocket-robot = "physicalai_websocket_robot_plugin.studio_catalog:register_physicalai_studio_plugin"

[tool.hatch.version]
source = "vcs"
raw-options = { search_parent_directories = true }

[tool.hatch.build.targets.wheel]
packages = ["src/physicalai_websocket_robot_plugin"]
