[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
physicalai-studio-plugin = { git = "https://github.com/open-edge-platform/physical-ai-studio.git", subdirectory = "application/plugin", rev = "83575bcb5e9abde01f03c9983a56bc468b66b726" }
physicalai = { git = "https://github.com/openvinotoolkit/physicalai.git", rev = "a7ee74d0a65bd8f27dc31d831210c7a905e92309" }

[dependency-groups]
dev = ["pytest", "mypy", "ruff>=0.15.14", "prek", "pyrefly>=0.58.0"]

[tool.ruff]
target-version = "py313"
line-length = 120
preview = true
src = ["packages/*/src"]
extend-exclude = ["urdf", "examples"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY001",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"packages/*/tests/**/*.py" = [
    "ARG001",
    "ARG002",
    "B903",
    "D",
    "INP001",
    "PLC0415",
    "PLC1901",
    "PLC2701",
    "PLR2004",
    "PLR6301",
    "RUF069",
    "S101",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-args = 15

[tool.pytest.ini_options]
testpaths = "packages/"
addopts = "--import-mode=importlib"

[tool.markdownlint]
default = true

[tool.markdownlint.MD001]
enabled = true

[tool.markdownlint.MD013]
line_length = 1000

[tool.markdownlint.MD024]
allow_different_nesting = true
siblings_only = true

[tool.markdownlint.MD033]
enabled = false

[tool.markdownlint.MD034]
enabled = false

[tool.markdownlint.MD036]
enabled = false

[tool.markdownlint.MD041]
enabled = false

[tool.markdownlint.MD042]
enabled = false

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "pass",
    "raise ImportError",
    "raise ValueError",
    "except ImportError:",
]

[tool.coverage.paths]
source = ["packages/*/src"]

[tool.pyrefly]
python-version = "3.12"
search-path = [
    "packages/physicalai-bimanual-so101-plugin/src",
    "packages/physicalai-rebot-b601-plugin/src",
]
project-includes = [
    "packages/physicalai-bimanual-so101-plugin/src",
    "packages/physicalai-rebot-b601-plugin/src",
]
